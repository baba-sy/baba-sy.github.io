---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
  </p>
  <div class="post-body">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/posts/' | relative_url }}">All posts</a></p>
</article>
